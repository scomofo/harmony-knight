# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: datetime_now_in_game_loop
    status: active
    description: "Never call DateTime.now() or Stopwatch inside GameEngine.update(). All timing must flow from AudioClock."
    why: "Non-deterministic timing breaks headless tests and replay. AudioClock is the single source of truth for gameplay time."
    adr: docs/architecture/adr-0001-deterministic-game-engine.md
    added: 2026-05-29

  - pattern: async_in_engine_update
    status: active
    description: "GameEngine.update() must be synchronous. No await, no Future, no I/O inside the update loop."
    why: "Async calls introduce non-determinism and unpredictable latency in the hot path. I/O belongs in services outside the engine."
    adr: docs/architecture/adr-0001-deterministic-game-engine.md
    added: 2026-05-29

  - pattern: engine_state_in_riverpod
    status: active
    description: "Do not put per-frame EngineState in a Riverpod provider. Pass it directly to the renderer."
    why: "Per-frame Riverpod updates (60/s) cause excessive widget rebuilds. EngineState is a render value, not application state."
    adr: docs/architecture/adr-0001-deterministic-game-engine.md
    added: 2026-05-29

  - pattern: direct_statenotifier_state_write
    status: active
    description: "External code must never write to a StateNotifier's state directly. All mutations go through notifier methods."
    why: "Direct state writes bypass persistence hooks and break the single-owner pattern established in ADR-0002."
    adr: docs/architecture/adr-0002-riverpod-state-management.md
    added: 2026-05-29

